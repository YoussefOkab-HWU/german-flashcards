<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ich lerne deutsch</title>
<link rel="manifest" href="manifest.json">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ich lerne deutsch">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --text: #e8eaf6;
    --muted: #7b82a8;
    --accent: #6c7dff;
    --accent-dim: #3d4799;
    --green: #4caf7d;
    --green-dim: #1a3d2e;
    --red: #f25f5c;
    --red-dim: #3d1a1a;
    --yellow: #ffd166;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* Mastery bar */
  .masterybar {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .masterybar .val {
    font-size: 1.1rem;
    font-weight: 700;
  }
  .masterybar .learned-val { color: var(--green); }
  .masterybar .remaining-val { color: var(--text); }
  .btn-view-learned {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-view-learned:hover { border-color: var(--green); color: var(--green); }

  /* Per-word mastery dots */
  .mastery-dots {
    display: flex;
    gap: 7px;
    margin-top: 4px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    transition: background 0.2s, border-color 0.2s;
  }
  .dot.filled { background: var(--green); border-color: var(--green); }

  /* Learned words panel */
  .learned-panel {
    display: none;
    width: 100%;
    max-width: 600px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
    margin-top: 12px;
  }
  .learned-panel.open { display: block; }
  .learned-panel h2 {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--green);
    margin-bottom: 14px;
  }
  .learned-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 260px;
    overflow-y: auto;
  }
  .learned-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 12px;
    font-size: 0.85rem;
    color: var(--text);
  }
  .learned-chip span { color: var(--muted); font-size: 0.78rem; margin-left: 5px; }

  /* Filter buttons */
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 28px;
  }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: all 0.15s;
    user-select: none;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--text);
  }

  /* Card */
  .card-wrap {
    width: 100%;
    max-width: 600px;
    perspective: 800px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px 40px;
    text-align: center;
    position: relative;
    transition: border-color 0.25s;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .card.correct { border-color: var(--green); background: #182a22; }
  .card.wrong   { border-color: var(--red);   background: #2a1818; }

  .category-badge {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    background: var(--surface2);
    padding: 3px 10px;
    border-radius: 10px;
  }

  .card-counter {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .german-word {
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.1;
    color: var(--text);
  }

  /* Feedback overlay */
  .feedback {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    font-size: 1.05rem;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px;
    transition: opacity 0.2s;
    width: 100%;
    max-width: 100%;
    word-break: break-word;
    text-align: center;
    line-height: 1.4;
  }
  .feedback.hidden { opacity: 0; pointer-events: none; background: transparent; border: none; }
  .feedback.correct { color: #fff; background: #1e6644; border: 1px solid var(--green); }
  .feedback.wrong   { color: #fff; background: #6b1f1f; border: 1px solid var(--red); }
  .feedback-icon { font-size: 1.3rem; flex-shrink: 0; }

  /* Input area */
  .input-area {
    width: 100%;
    max-width: 600px;
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 1.1rem;
    padding: 14px 18px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--text);
    font-size: 1rem;
    font-weight: 600;
    padding: 14px 22px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
    user-select: none;
  }
  .btn:hover  { background: var(--accent); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-skip {
    background: var(--surface);
    border-color: var(--border);
    color: var(--muted);
  }
  .btn-skip:hover { background: var(--surface2); color: var(--text); border-color: var(--muted); }

  /* Next button (shown after answer) */
  .btn-next {
    width: 100%;
    max-width: 600px;
    margin-top: 10px;
    padding: 13px;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: none;
  }
  .btn-next.visible { display: block; }

  .word-breakdown {
    width: 100%;
    max-width: 600px;
    margin-top: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .word-breakdown .wb-title {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .word-breakdown .wb-part {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .word-breakdown .wb-de {
    font-weight: 700;
    color: var(--text);
    font-size: 0.95rem;
  }
  .word-breakdown .wb-en {
    color: var(--muted);
  }
  .word-breakdown .wb-arrow {
    color: var(--border);
    font-size: 0.8rem;
  }

  /* Breakdown explorer */
  #breakdown-search {
    width: 100%; box-sizing: border-box; padding: 10px 14px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    font-size: 1rem; margin-bottom: 10px;
  }
  #breakdown-list { display: flex; flex-direction: column; gap: 8px; max-height: 65vh; overflow-y: auto; }
  .be-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .be-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 1rem; }
  .be-en { color: var(--muted); font-size: 0.85rem; }
  .be-row { display: flex; gap: 8px; align-items: baseline; font-size: 0.88rem; }
  .be-de { font-weight: 700; color: var(--text); min-width: 90px; }
  .be-arrow { color: var(--border); }
  .be-meaning { color: var(--muted); }
  .be-empty { color: var(--muted); font-size: 0.9rem; padding: 12px 0; }

  /* Speaker button */
  .btn-speak {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 6px;
    font-size: 1.1rem;
    opacity: 0.7;
    vertical-align: middle;
    line-height: 1;
    border-radius: 6px;
    transition: opacity 0.15s;
  }
  .btn-speak:hover { opacity: 1; background: rgba(255,255,255,0.08); }

  /* Progress bar */
  .progress-wrap {
    width: 100%;
    max-width: 600px;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  /* Mode toggle */
  .mode-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
  }
  .mode-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
    padding: 8px 20px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .mode-btn.active { background: var(--accent-dim); color: var(--text); border: 1px solid var(--accent); }
  .mode-btn:hover:not(.active) { color: var(--text); }

  /* Tense filters (sentences mode) */
  .tense-filters {
    display: none;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 16px;
  }
  .tense-filters.visible { display: flex; }

  /* Sentence card content */
  .sentence-de {
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text);
    text-align: center;
  }
  .sentence-blank { color: var(--accent); border-bottom: 2px solid var(--accent); padding: 0 4px; }
  .sentence-en {
    font-size: 0.95rem;
    color: var(--muted);
    text-align: center;
    font-style: italic;
    margin-top: 4px;
  }
  .tense-badge {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 3px 10px;
    border-radius: 10px;
    background: var(--surface2);
    color: var(--muted);
  }
  .tense-badge.present { color: #6cf; background: #0d2233; }
  .tense-badge.past    { color: var(--yellow); background: #2a2000; }
  .tense-badge.future  { color: #b47fff; background: #1e0d33; }
  .tense-badge.question { color: var(--green); background: var(--green-dim); }

  /* Language selection screen */
  .lang-select-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    z-index: 100;
  }
  .lang-select-screen h2 {
    font-size: 1rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  .lang-options {
    display: flex;
    gap: 20px;
  }
  .lang-option {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 32px 40px;
    text-align: center;
    cursor: pointer;
    transition: all 0.18s;
    min-width: 180px;
  }
  .lang-option:hover { border-color: var(--accent); background: var(--surface2); transform: translateY(-2px); }
  .lang-option .flag { font-size: 2.8rem; margin-bottom: 10px; }
  .lang-option .dir { font-size: 1rem; font-weight: 700; color: var(--text); }
  .lang-option .sub { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .lang-option .arrow { font-size: 1.5rem; color: var(--accent); margin: 8px 0; }

  /* German special character buttons */
  .umlaut-bar {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 600px;
    margin-top: 8px;
  }
  .umlaut-btn {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.2rem;
    font-weight: 700;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.12s;
    user-select: none;
  }
  .umlaut-btn:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
  .umlaut-bar.hidden { display: none; }

  @media (max-width: 480px) {
    body {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      padding: 10px 12px 12px;
      justify-content: flex-start;
      overflow: hidden;
    }

    h1 { font-size: 0.72rem; margin-bottom: 6px; }

    .mode-toggle { margin-bottom: 8px; width: 100%; }
    .mode-btn { font-size: 0.82rem; padding: 6px 14px; }

    .masterybar { margin-bottom: 6px; font-size: 0.75rem; gap: 8px; width: 100%; }
    .masterybar .val { font-size: 0.9rem; }
    .btn-view-learned { font-size: 0.7rem; padding: 3px 8px; }

    .filters { gap: 6px; margin-bottom: 8px; flex-wrap: nowrap; width: 100%; }
    .filter-btn { padding: 5px 10px; font-size: 0.75rem; white-space: nowrap; flex-shrink: 0; }

    .tense-filters { margin-bottom: 8px; gap: 6px; }
    .progress-wrap { margin-bottom: 8px; }

    .card-wrap { width: 100%; }
    .card {
      min-height: unset;
      padding: 36px 20px 20px;
      border-radius: 14px;
      width: 100%;
    }

    .german-word { font-size: 2.2rem; }
    .sentence-de { font-size: 1.15rem; }
    .mastery-dots { margin-top: 8px; }
    .feedback { font-size: 0.88rem; padding: 8px 12px; }

    /* Stack input then buttons row below */
    .input-area {
      margin-top: 10px;
      flex-direction: column;
      gap: 8px;
      max-width: 100%;
    }
    .input-area input[type="text"] {
      width: 100%;
      padding: 13px 14px;
      font-size: 1rem;
    }
    .input-area .btn { padding: 13px 16px; font-size: 0.95rem; }
    .input-buttons-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .input-buttons-row .btn { flex: 1; }

    .btn-next { margin-top: 8px; padding: 11px; }

    .umlaut-bar { display: none !important; }
    .lang-options { flex-direction: column; }
    .learned-panel { max-height: 40vh; overflow-y: auto; }
  }
</style>
</head>
<body>

<!-- Language direction selection screen -->
<!-- Password screen -->
<div class="lang-select-screen" id="pw-screen">
  <h2>German Flashcards</h2>
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:320px">
    <input type="password" id="pw-input" placeholder="Enter password…" autocomplete="off"
      style="width:100%;padding:14px 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1.1rem;outline:none;text-align:center"
      onkeydown="if(event.key==='Enter')checkPassword()" />
    <button onclick="checkPassword()"
      style="width:100%;padding:14px;border-radius:12px;background:var(--accent-dim);border:1px solid var(--accent);color:var(--text);font-size:1rem;font-weight:600;cursor:pointer">
      Unlock
    </button>
    <div id="pw-error" style="color:var(--red);font-size:0.9rem;min-height:1.2em"></div>
  </div>
</div>

<div class="lang-select-screen" id="lang-select-screen" style="display:none">
  <h2>Choose direction</h2>
  <div class="lang-options">
    <div class="lang-option" onclick="startApp('de-en')">
      <div class="flag">🇩🇪</div>
      <div class="arrow">↓</div>
      <div class="flag">🇬🇧</div>
      <div class="dir">German → English</div>
      <div class="sub">Read German, write English</div>
    </div>
    <div class="lang-option" onclick="startApp('en-de')">
      <div class="flag">🇬🇧</div>
      <div class="arrow">↓</div>
      <div class="flag">🇩🇪</div>
      <div class="dir">English → German</div>
      <div class="sub">Read English, write German</div>
    </div>
  </div>
</div>

<h1>German Flashcards</h1>

<div class="mode-toggle">
  <button class="mode-btn active" id="mode-flashcards">Flashcards</button>
  <button class="mode-btn" id="mode-sentences">Sentences</button>
  <button class="mode-btn" id="mode-breakdown">Breakdown</button>
</div>

<div id="breakdown-explorer" style="display:none;width:100%;max-width:600px;margin-top:12px;">
  <input type="text" id="breakdown-search" placeholder="Search words…" autocomplete="off" />
  <div id="breakdown-list"></div>
</div>

<div class="masterybar">
  <span><span class="val learned-val" id="count-learned">0</span> learned</span>
  <span>·</span>
  <span><span class="val remaining-val" id="count-remaining">0</span> remaining</span>
  <button class="btn-view-learned" id="btn-view-learned">View learned ▾</button>
</div>

<div class="filters" id="filters"></div>
<div class="tense-filters" id="tense-filters"></div>

<div class="progress-wrap">
  <div class="progress-bar" id="progress-bar"></div>
</div>

<div class="card-wrap" id="card-wrap">
  <div class="card" id="card">
    <span class="card-counter" id="card-counter"></span>
    <span class="tense-badge" id="tense-badge" style="display:none"></span>
    <span class="category-badge" id="category-badge"></span>
    <div class="german-word" id="german-word"></div>
    <button class="btn-speak" id="btn-speak-word" style="display:none" title="Pronounce">🔊</button>
    <div class="sentence-de" id="sentence-de" style="display:none"></div>
    <div class="sentence-en" id="sentence-en" style="display:none"></div>
    <div class="mastery-dots" id="mastery-dots"></div>
    <div class="feedback hidden" id="feedback"></div>
  </div>
</div>

<div class="learned-panel" id="learned-panel">
  <h2>Words Learned</h2>
  <div class="learned-list" id="learned-list"></div>
</div>

<div class="input-area" id="input-area">
  <input type="text" id="answer-input" placeholder="Type English translation…" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" />
  <div class="input-buttons-row">
    <button class="btn" id="btn-check">Check</button>
    <button class="btn btn-skip" id="btn-skip">Skip</button>
  </div>
</div>

<div class="umlaut-bar hidden" id="umlaut-bar">
  <button class="umlaut-btn" onclick="insertUmlaut('ä')">ä</button>
  <button class="umlaut-btn" onclick="insertUmlaut('ö')">ö</button>
  <button class="umlaut-btn" onclick="insertUmlaut('ü')">ü</button>
  <button class="umlaut-btn" onclick="insertUmlaut('ß')">ß</button>
</div>

<button class="btn btn-next" id="btn-next">Next card →</button>
<div id="word-breakdown" class="word-breakdown" style="display:none"></div>

<script>
const DATA = {
  "verbs": [
    {"german": "werden", "english": "to become"},
    {"german": "spielen", "english": "to play"},
    {"german": "leben", "english": "to live"},
    {"german": "fragen", "english": "to ask"},
    {"german": "antworten", "english": "to answer"},
    {"german": "präsentieren", "english": "to present"},
    {"german": "verhandeln", "english": "to negotiate"},
    {"german": "investieren", "english": "to invest"},
    {"german": "finanzieren", "english": "to finance"},
    {"german": "leihen", "english": "to lend / borrow"},
    {"german": "verkaufen", "english": "to sell"},
    {"german": "bezahlen", "english": "to pay"},
    {"german": "holen", "english": "to fetch"},

// ── Build flat card list with category tags ──────────────────────────────────
function buildCards(filter) {
  let cards = [];
  const categories = Object.keys(DATA);
  for (const cat of categories) {
    if (filter === 'all' || filter === cat) {
      DATA[cat].forEach(item => cards.push({ ...item, category: cat }));
    }
  }
  return cards;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Split an english field on "/" or "," into individual accepted answers
function parseAnswers(english) {
  return english.split(/[\/,]/).map(s => s.trim().toLowerCase()).filter(Boolean);
}

// Strip articles and verb "to" prefix for fuzzy comparison
function normalize(s) {
  return s.trim().toLowerCase()
    .replace(/^to\s+/, '')
    .replace(/^(the|a|an)\s+/, '');
}

// Levenshtein distance
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m + 1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}

// Check if input is close enough to an accepted answer
function isFuzzyMatch(input, accepted, german) {
  const normInput = normalize(input);
  // Check user-accepted synonyms first
  const custom = (german && synonyms[german]) || [];
  for (const syn of custom) {
    if (normalize(syn) === normInput) return true;
  }
  for (const ans of accepted) {
    const normAns = normalize(ans);
    if (normInput === normAns) return true;
    // Allow 1 typo for words 5+ chars, 2 typos for 9+ chars
    const maxDist = normAns.length >= 9 ? 2 : normAns.length >= 5 ? 1 : 0;
    if (maxDist > 0 && levenshtein(normInput, normAns) <= maxDist) return true;
  }
  return false;
}

function pushToCloud() {
  CLOUD_DOC.set({
    progress: progress,
    sentenceProgress: sentenceProgress,
    priorityQueue: priorityQueue,
    cardsSinceStart: cardsSinceStart,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).catch(() => {});
}

// Merge: take higher consecutive, preserve learned=true
function mergeProgress(local, remote) {
  const merged = Object.assign({}, local);
  for (const [k, rv] of Object.entries(remote)) {
    const lv = local[k];
    if (!lv) { merged[k] = rv; continue; }
    merged[k] = {
      consecutive: Math.max(lv.consecutive || 0, rv.consecutive || 0),
      learned: lv.learned || rv.learned
    };
  }
  return merged;
}

async function pullFromCloud() {
  try {
    const snap = await CLOUD_DOC.get();
    if (!snap.exists) return;
    const data = snap.data();
    if (data.progress) {
      progress = mergeProgress(progress, data.progress);
      saveProgressLocal(progress);
    }
    if (data.sentenceProgress) {
      sentenceProgress = Object.assign(data.sentenceProgress, sentenceProgress);
      saveSentenceProgressLocal();
    }
    if (data.priorityQueue) {
      // Union local + cloud queues; for duplicate words keep the entry with higher dueAt.
      const merged = new Map();
      for (const e of [...priorityQueue, ...data.priorityQueue]) {
        if (!merged.has(e.german) || e.dueAt > merged.get(e.german).dueAt) merged.set(e.german, e);
      }
      priorityQueue = cleanPriorityQueue(Array.from(merged.values()));
      savePriorityQueueLocal();
    }
    if (data.cardsSinceStart && data.cardsSinceStart > cardsSinceStart) {
      cardsSinceStart = data.cardsSinceStart;
      localStorage.setItem('gfc_cards_count', cardsSinceStart);
    }
  } catch(e) {}
}

// ── Progress helpers ─────────────────────────────────────────────────────────
function getWordState(german) {
  return progress[german] || { consecutive: 0, learned: false };
}

function markCorrect(german) {
  const s = getWordState(german);
  s.consecutive = (s.consecutive || 0) + 1;
  if (s.consecutive >= 5) s.learned = true;
  progress[german] = s;
  saveProgress(progress);
  // Remove from priority queue if answered correctly
  priorityQueue = priorityQueue.filter(e => e.german !== german);
  savePriorityQueue();
}

function markWrong(german) {
  const s = getWordState(german);
  s.consecutive = 0;
  // If was mastered, un-master it and return to active pool
  s.learned = false;
  progress[german] = s;
  saveProgress(progress);
  // Add/reset in priority queue — reappear after 15 cards
  priorityQueue = priorityQueue.filter(e => e.german !== german);
  const delay = 15 + Math.floor(Math.random() * 36); // 15–50
  priorityQueue.push({ german, dueAt: cardsSinceStart + delay });
  savePriorityQueue();
}

}
// Remove entries for words that have been answered correctly since being queued.
// If consecutive > 0, markCorrect should have removed the entry — if it's still
// here it's a stale entry from a sync or a previous session.
function cleanPriorityQueue(queue) {
  return queue.filter(e => getWordState(e.german).consecutive === 0);
}
function savePriorityQueueLocal() {
  localStorage.setItem('gfc_pq', JSON.stringify(priorityQueue));
  localStorage.setItem('gfc_cards_count', cardsSinceStart);
}
function savePriorityQueue() {
  savePriorityQueueLocal();
  scheduleCloudSync();
}
let cardsSinceStart = parseInt(localStorage.getItem('gfc_cards_count') || '0');
let priorityQueue = cleanPriorityQueue(loadPriorityQueue());

function getNextCard() {
  cardsSinceStart++;
  localStorage.setItem('gfc_cards_count', cardsSinceStart);
  // Check if any priority card is due AND in the current filter
  const allCards = buildCards(activeFilter);
  const due = priorityQueue.find(e => cardsSinceStart >= e.dueAt && allCards.some(c => c.german === e.german));
  if (due) {
    priorityQueue = priorityQueue.filter(e => e !== due);
    savePriorityQueueLocal();
    const card = allCards.find(c => c.german === due.german);
    if (card) return card;
  }
  // 1 in 50 chance: show a mastered word as ghost
  const mastered = allCards.filter(c => getWordState(c.german).learned);
  if (mastered.length > 0 && Math.random() < 1/50) {
    return mastered[Math.floor(Math.random() * mastered.length)];
  }
  // Normal random unlearned card — skip words already queued for retry
  const queuedWords = new Set(priorityQueue.map(e => e.german));
  const active = allCards.filter(c => !getWordState(c.german).learned && !queuedWords.has(c.german));
  if (active.length === 0) return null;
  return active[Math.floor(Math.random() * active.length)];
}

function getUnlearnedCards() {
  return buildCards(activeFilter).filter(c => !getWordState(c.german).learned);

function resetDeck() {

    loadSentencesAndQuestions().then(ok => {
      if (!ok) return;
      const cards = buildSentenceDeck();
      if (cards.length === 0) {
        elCard.className = 'card';

      elMasteryDots.innerHTML = '';

function acceptAnswer(card, input) {

  if (!synonyms[card.german]) synonyms[card.german] = [];

    synonyms[card.german].push(input);

  const learned = getWordState(card.german).learned;

// ── Sentences deck ────────────────────────────────────────────────────────────
function buildSentenceDeck() {
  const tenses = activeTense === 'all' ? ['present', 'past', 'future'] : [activeTense];
  const pronouns = ['ich', 'du', 'er/sie', 'wir', 'ihr'];
  const cards = [];
  // Build a map from lowercased word → actual progress key used in DATA
  if (!buildSentenceDeck._keyMap) {
    const map = {};
    for (const cat of Object.values(DATA)) {
      for (const entry of cat) map[entry.german.toLowerCase()] = entry.german;
    }
    buildSentenceDeck._keyMap = map;
  }
  const keyMap = buildSentenceDeck._keyMap;

  if (SENTENCES) {
    for (const [word, data] of Object.entries(SENTENCES)) {
      const progressKey = keyMap[word.toLowerCase()] || word;
      if (!getWordState(progressKey).learned) continue;
      for (const tense of tenses) {
        if (!data[tense]) continue;
        for (const pronoun of pronouns) {
          const list = data[tense][pronoun];
          if (!list || !list.length) continue;
          const stub = { german: word, tense, pronoun };
          if (getSentenceState(stub).learned) continue;
          const pick = list[Math.floor(Math.random() * list.length)];
          cards.push({ german: word, tense, pronoun, de: pick.de, en: pick.en });
        }
      }
    }
  }

  // Add question cards (pronoun = 'question' sentinel)
  if (QUESTIONS) {
    for (const [word, data] of Object.entries(QUESTIONS)) {
      const progressKey = keyMap[word.toLowerCase()] || word;
      if (!getWordState(progressKey).learned) continue;
      for (const tense of tenses) {
        if (!data[tense] || !data[tense].length) continue;
        const stub = { german: word, tense, pronoun: 'question' };
        if (getSentenceState(stub).learned) continue;
        const pick = data[tense][Math.floor(Math.random() * data[tense].length)];
        cards.push({ german: word, tense, pronoun: 'question', de: pick.de, en: pick.en });
      }
    }
  }

  return cards;
}

// Word-overlap fuzzy check for full sentences
function isSentenceFuzzyMatch(input, reference) {
  const norm = s => s.toLowerCase().replace(/[.,!?;:"'()[\]{}\-–—]/g, '').trim();
  const words = s => norm(s).split(/\s+/).filter(w => w.length > 2);
  const inputWords = new Set(words(input));
  const refWords = words(reference);
  if (refWords.length === 0) return false;
  const matches = refWords.filter(w => {
    if (inputWords.has(w)) return true;
    // allow 1 typo per word for words 5+ chars
    for (const iw of inputWords) {
      if (Math.abs(iw.length - w.length) <= 2 && levenshtein(iw, w) <= (w.length >= 5 ? 1 : 0)) return true;
    }
    return false;
  });
  return matches.length / refWords.length >= 0.65;
}

  const target = langDir === 'en-de' ? card.de : card.en;
  const isCorrect = isSentenceFuzzyMatch(input, target);

  if (isCorrect) {
    markSentenceCorrect(card);
    const state = getSentenceState(card);
    const suffix = state.learned ? ' 🎓 Mastered!' : ` (${state.consecutive}/3)`;
    elCard.classList.add('correct');
    elFeedback.className = 'feedback correct';
    elFeedback.innerHTML = `<span class="feedback-icon">✓</span> Correct!${suffix} &nbsp;<strong>${target}</strong>`;
  } else {
    markSentenceWrong(card);
    elCard.classList.add('wrong');
    elFeedback.className = 'feedback wrong';
    elFeedback.innerHTML = `<span class="feedback-icon">✗</span> Correct: <strong style="margin-left:4px">${target}</strong><button onclick="acceptSentence()" style="margin-left:12px;padding:3px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.12);color:#fff;font-size:0.82rem;font-weight:600;cursor:pointer">Accept my answer</button>`;
  }

}

}

const AUTH_KEY = "gfc_auth";

function checkPassword() {
  const input = document.getElementById('pw-input').value;
  if (input === PASSWORD) {
    localStorage.setItem(AUTH_KEY, 'true');
    document.getElementById('pw-screen').style.display = 'none';
    document.getElementById('lang-select-screen').style.display = '';
  } else {
    document.getElementById('pw-error').textContent = 'Wrong password';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

// On load: skip password if already authenticated on this device
(function() {
  if (localStorage.getItem(AUTH_KEY) === 'true') {
    document.getElementById('pw-screen').style.display = 'none';
    document.getElementById('lang-select-screen').style.display = '';
  } else {
    document.getElementById('lang-select-screen').style.display = 'none';
    setTimeout(() => document.getElementById('pw-input').focus(), 100);
  }
})();

function startApp(dir) {
  langDir = dir;
  elLangScreen.style.display = 'none';
  // Show/hide umlaut bar
  elUmlautBar.classList.toggle('hidden', dir === 'de-en');
  // Update placeholder
  elInput.placeholder = dir === 'en-de' ? 'Schreib das deutsche Wort…' : 'Type English translation…';
  buildFilters();
  buildTenseFilters();
  // Pull cloud progress then start (fall back immediately if offline)
  loadBreakdowns(); // fire and forget — available before first card is answered
  pullFromCloud().finally(() => resetDeck());
}

function insertUmlaut(char) {
  const start = elInput.selectionStart;
  const end   = elInput.selectionEnd;
  const val   = elInput.value;
  elInput.value = val.slice(0, start) + char + val.slice(end);
  elInput.selectionStart = elInput.selectionEnd = start + 1;
  elInput.focus();
}

// ── Strict German matching (EN→DE mode) ──────────────────────────────────────
function normalizeGerman(s) {
  return s.trim().toLowerCase()
    .replace(/^(der|die|das|ein|eine)\s+/i, ''); // strip articles
}

function isGermanMatch(input, card) {
  // Exact match only — must match this specific card's German word
  // Wrong article = wrong answer
  return input.trim().toLowerCase() === card.german.trim().toLowerCase();
}

// Build a map: lowercase core word (no article) → { german, english }
let wordCoreMap = null;
function getWordCoreMap() {
  if (wordCoreMap) return wordCoreMap;
  wordCoreMap = {};
  // First add roots as fallback entries
  for (const [root, meaning] of Object.entries(ROOTS)) {
    wordCoreMap[root] = { german: root, english: meaning };
  }
  // Dataset entries override roots
  for (const cat of Object.values(DATA)) {
    for (const entry of cat) {
      const core = entry.german.replace(/^(der|die|das|ein|eine|zu)\s+/i, '').toLowerCase();
      wordCoreMap[core] = entry;
    }
  }
  return wordCoreMap;
}

// Suffixes to strip when looking up roots (longest first)
const SUFFIXES = ['erisch', 'isch', 'lich', 'heit', 'keit', 'ung', 'nis', 'sam', 'bar', 'ig', 'er', 'en', 'e'];

function stripSuffix(word) {
  for (const s of SUFFIXES) {
    if (word.endsWith(s) && word.length - s.length >= 3) {
      return word.slice(0, word.length - s.length);
    }
  }
  return null;
}

function lookupInMap(map, s) {
  return map[s] || map[s.charAt(0).toUpperCase() + s.slice(1)] || null;
}

// Resolve a segment into 1+ parts (used inside decomposition only)
function resolveSegment(word, map, depth) {
  if (depth <= 0 || word.length < 2) return null;
  // Direct match
  let m = lookupInMap(map, word);
  if (!m) {
    for (const art of ['der ', 'die ', 'das ']) { m = lookupInMap(map, art + word); if (m) break; }
  }
  if (!m) {
    const stripped = stripSuffix(word);
    if (stripped) m = lookupInMap(map, stripped) || lookupInMap(map, stripped + 'en') || lookupInMap(map, stripped + 'n');
  }
  if (m) return [{ de: m.german, en: m.english }];
  // Recurse: try splitting this segment further
  return splitSegment(word, map, depth);
}

// Split a segment into 2+ parts recursively
function splitSegment(word, map, depth) {
  if (depth <= 1 || word.length < 4) return null;
  for (let i = 3; i <= word.length - 3; i++) {
    const first = word.slice(0, i);
    const m1 = lookupInMap(map, first);
    if (!m1) continue;
    const second = word.slice(i);
    // Direct recursion
    const rest = resolveSegment(second, map, depth - 1);
    if (rest) return [{ de: m1.german, en: m1.english }, ...rest];
    // Try stripping binding morpheme at junction (e.g. Arbeit-s-platz, Kind-er-garten)
    for (const b of ['ens', 'es', 'er', 's', 'en', 'n']) {
      if (second.startsWith(b) && second.length > b.length + 2) {
        const rest2 = resolveSegment(second.slice(b.length), map, depth - 1);
        if (rest2) return [{ de: m1.german, en: m1.english }, ...rest2];
      }
    }
  }
  return null;
}

function decomposeWord(german) {
  const map = getWordCoreMap();
  const core = german.replace(/^(der|die|das|ein|eine)\s+/i, '').replace(/^sich\s+/i, '').toLowerCase();

  // Try prefix + recursive remainder (up to 3 more parts = 4 total)
  for (const [prefix, prefixMeaning] of Object.entries(PREFIXES)) {
    if (core.startsWith(prefix) && core.length > prefix.length + 2) {
      const remainder = core.slice(prefix.length);
      const rest = resolveSegment(remainder, map, 3);
      if (rest) return [{ de: prefix, en: prefixMeaning }, ...rest];
    }
  }

  // Try compound split (up to 4 parts)
  const parts = splitSegment(core, map, 4);
  if (parts && parts.length >= 2) return parts;

  return null;
}

function showBreakdown(german) {
  const el = document.getElementById('word-breakdown');
  // Use Ollama-generated breakdowns first, fall back to algorithm
  const core = german.replace(/^(der|die|das|ein|eine)\s+/i, '').replace(/^sich\s+/i, '').trim();
  let parts = null;
  if (BREAKDOWNS) {
    // Try exact match, then case-insensitive
    parts = BREAKDOWNS[german] || BREAKDOWNS[core] ||
      BREAKDOWNS[Object.keys(BREAKDOWNS).find(k => k.toLowerCase() === german.toLowerCase())] ||
      BREAKDOWNS[Object.keys(BREAKDOWNS).find(k => k.toLowerCase() === core.toLowerCase())] ||
      null;
  }
  if (!parts) parts = decomposeWord(german);
  if (!parts || parts.length < 2) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = `<div class="wb-title">Word breakdown</div>` +
    parts.map(p => `<div class="wb-part"><span class="wb-de">${p.de}</span><span class="wb-arrow">→</span><span class="wb-en">${p.en}</span></div>`).join('');
}

function hideBreakdown() {
  document.getElementById('word-breakdown').style.display = 'none';
}

// ── Text-to-speech ────────────────────────────────────────────────────────────
function buildSpeakBtn(german) {
  return `<button class="btn-speak" onclick="speakGerman('${german.replace(/'/g, "\\'")}')" title="Pronounce">🔊</button>`;
}

function speakGerman(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
